name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas de empacotamento
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils

      - name: Resolver versão
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ "$V" = "$GITHUB_REF_NAME" ]; then
            V="0.0.0-${GITHUB_REF_NAME//\//-}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Conferir versão
        run: |
          CODE_V="$(python3 -c "import re; m=re.search(r'^VERSION = \"([^\"]+)\"', open('tradutor.py').read(), re.M); print(m.group(1) if m else '')")"
          [ -n "$CODE_V" ] || { echo "erro: VERSION não encontrada em tradutor.py" >&2; exit 1; }
          MAN_V="$(grep -o 'tradutor [0-9][0-9.]*' tradutor.1 | head -1 | cut -d' ' -f2)"
          [ -n "$MAN_V" ] || { echo "erro: versão não encontrada no .TH de tradutor.1" >&2; exit 1; }
          echo "tag: ${GITHUB_REF_NAME#v} | code: $CODE_V | man: $MAN_V"
          case "$GITHUB_REF_NAME" in
            v*)
              TAG_V="${GITHUB_REF_NAME#v}"
              [ "$CODE_V" = "$TAG_V" ] || { echo "erro: tag v$TAG_V ≠ VERSION em tradutor.py ($CODE_V) — faça o bump antes de publicar" >&2; exit 1; }
              [ "$MAN_V" = "$CODE_V" ] || { echo "erro: man page ($MAN_V) ≠ VERSION ($CODE_V) — sincronize tradutor.1" >&2; exit 1; }
              ;;
          esac

      - name: Build do .deb
        run: bash packaging/build-deb.sh "${{ steps.ver.outputs.version }}"

      - name: Importar chave de assinatura
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "erro: secret GPG_PRIVATE_KEY não configurada" >&2; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build do repositório APT assinado
        run: bash packaging/build-apt-repo.sh tradutor_*_all.deb apt-root

      - name: Publicar repositório APT no GitHub Pages (gh-pages)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf pages && mkdir pages
          cp -r apt-root/. pages/
          cp packaging/keyring.asc pages/key.gpg
          cp install.sh pages/install.sh
          cd pages
          git init -q -b gh-pages
          git add -A
          git commit -qm "apt repo ${{ steps.ver.outputs.version }}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Anexar .deb ao GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" tradutor_*_all.deb --clobber
